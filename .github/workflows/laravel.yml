name: laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.0
        coverage: none

    - name: Get composer cache
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies (including dev)
      run: composer install -q --no-ansi --no-interaction --no-progress

    - name: Prepare environment
      run: |
        cp .env.example .env || true
        # Ensure tests use in-memory sqlite by default if phpunit.xml/env not set
        php -r "file_exists('.env') || file_put_contents('.env', \"DB_CONNECTION=sqlite\nDB_DATABASE=:memory:\n\");"

    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
        
    - name: Run tests (with composer)
      run: |
        composer test
